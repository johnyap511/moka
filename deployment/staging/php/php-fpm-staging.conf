; PHP-FPM pool configuration for MOKA staging
[www]
; Listen on TCP socket so Nginx can reach it across Docker network
listen = 0.0.0.0:9000

; Process manager — dynamic is fine for staging load
pm = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests      = 500

; Pass real client IP through when behind Nginx
clear_env = no
