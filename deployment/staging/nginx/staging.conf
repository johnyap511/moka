# =============================================================================
# MOKA Staging — Nginx configuration
# Listens on port 8080, no SSL (IP-only staging access)
# =============================================================================

# Upstream PHP-FPM pool (service name "app" resolves via Docker DNS)
upstream php_fpm {
    server app:9000;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# Gzip compression
# ---------------------------------------------------------------------------
gzip             on;
gzip_comp_level  5;
gzip_min_length  256;
gzip_proxied     any;
gzip_vary        on;
gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rss+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/opentype
    image/svg+xml
    image/x-icon
    text/cache-manifest
    text/css
    text/plain
    text/vcard
    text/vnd.rim.location.xloc
    text/vtt
    text/x-component
    text/x-cross-domain-policy;

# ---------------------------------------------------------------------------
# Main server block
# ---------------------------------------------------------------------------
server {
    listen      8080;
    server_name _;    # Accept any hostname / raw IP

    root  /var/www/html/public;
    index index.php index.html;

    # Max upload size — adjust if MOKA allows large file uploads
    client_max_body_size 64M;

    # Keep-alive
    keepalive_timeout  65;
    send_timeout       120;

    # ---------------------------------------------------------------------------
    # Security headers (no HSTS since no SSL on staging)
    # ---------------------------------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN"             always;
    add_header X-Content-Type-Options    "nosniff"                always;
    add_header X-XSS-Protection          "1; mode=block"          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=()" always;
    # Identify this as staging in response headers (useful for debugging)
    add_header X-Environment             "staging"                always;

    # ---------------------------------------------------------------------------
    # Deny access to sensitive files
    # ---------------------------------------------------------------------------
    # Block .env files absolutely
    location ~ /\.env {
        deny all;
        return 404;
    }

    # Block all hidden files/directories (e.g. .git, .htaccess)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block direct access to Laravel internals
    location ~* ^/(storage|bootstrap|config|database|routes|tests|vendor)/ {
        deny all;
        return 404;
    }

    # ---------------------------------------------------------------------------
    # Static asset caching
    # ---------------------------------------------------------------------------
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|otf|webp|avif)$ {
        expires        30d;
        add_header     Cache-Control "public, immutable";
        access_log     off;
        log_not_found  off;
        try_files      $uri =404;
    }

    # ---------------------------------------------------------------------------
    # Favicon & robots — suppress 404 noise in logs
    # ---------------------------------------------------------------------------
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ---------------------------------------------------------------------------
    # Laravel storage symlink — serve user-uploaded files
    # ---------------------------------------------------------------------------
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------------------------------------------------------------------------
    # Main application entry point (Laravel front controller)
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---------------------------------------------------------------------------
    # PHP-FPM handler
    # ---------------------------------------------------------------------------
    location ~ \.php$ {
        # Mitigate PHP path-info vulnerability
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass            php_fpm;
        fastcgi_index           index.php;
        fastcgi_read_timeout    120;
        fastcgi_send_timeout    120;
        fastcgi_buffer_size     128k;
        fastcgi_buffers         4 256k;
        fastcgi_busy_buffers_size 256k;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # Pass real IP from any upstream proxy / GCP load balancer
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_REAL_IP       $remote_addr;
    }

    # ---------------------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------------------
    access_log /var/log/nginx/moka_staging_access.log combined;
    error_log  /var/log/nginx/moka_staging_error.log  warn;
}
